[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crushsim"
version = "0.1.0"
description = "Cylindrical can crush/strength simulation pipeline (Gmsh -> OpenRadioss -> report)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Crush-Sim" }]
keywords = ["fea", "openradioss", "gmsh", "shell", "crush", "can"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "jinja2>=3.1",
    "matplotlib>=3.8",
    "gmsh>=4.13",
    "pyvista>=0.44",
    "imageio[ffmpeg]>=2.34",
]

[project.optional-dependencies]
# OCP / cadquery-ocp is a heavy binary wheel: STEP inspection only (FR-02).
cad = ["cadquery-ocp>=7.7"]
# CATIA V5 COM automation (FR-01) is Windows-only.
windows = ["pywin32>=306"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
csim = "crushsim.cli:main"

[project.urls]
Homepage = "https://github.com/doroper98/Crush-Sim"

[tool.setuptools.packages.find]
include = ["crushsim*"]

[tool.setuptools.package-data]
crushsim = ["report/templates/*.j2"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "bench"]
addopts = "-ra"
markers = [
    "bench: validation benchmarks (§8); require a solver result file and are skipped otherwise",
    "slow: slower tests (meshing, rendering)",
]
filterwarnings = ["ignore::DeprecationWarning"]

# LC-6 v3 - prismatic vent burst: braced walls + laser-score-grade vent.
#
# v2 (braced walls, 14 x 7 vent at 0.06 mm residual) held the full 3 MPa
# with the score band at 0.8% plastic strain vs the 35% failure threshold:
# a small vent on the stiff narrow cap with a 1 mm-wide band at 10%
# residual thickness is far too strong - burst would need >>3 MPa. Real
# prismatic vents are long laser-scored grooves with a ~30-50 um residual.
# v3 moves the design into that regime: a 30 x 7 mm stadium scored to
# 0.03 mm, ramped to 6 MPa so the burst point is captured mid-ramp.

name: lc6_pris_vent_burst_v3
load_case: LC-3
description: >-
  Prismatic cell can (120.5 x 13.1 x 65, t0.6, Ni-plated steel, welded cap)
  with a 30 x 7 mm stadium vent laser-scored to 0.03 mm, large faces braced
  as in a module: internal pressure ramp to burst through the score band.

geometry:
  kind: box_can
  width: 120.5
  depth: 13.1
  height: 65.0
  thickness: 0.6
  closed_bottom: true
  closed_top: true
  vent:
    length: 30.0
    width: 7.0
    band: 1.0
    score_thickness: 0.03

material:
  key: ni_plated_steel_can
  eps_p_max: 0.35           # score band tears here -> element deletion

mesh:
  target_size: 1.2
  recombine: true
  curvature_points: 12

loading:
  tool: none                # pressure-driven
  clamp_can_base: true
  brace_walls: true         # jelly roll + module end plates on the large faces

pressure:
  peak: 6.0                 # MPa - typical prismatic vent range is 1-3 MPa
  rise: 3.0e-3
  hold: 1.0e-3

contact:
  friction: 0.15

solver:
  config: configs/solver.yaml
  threads: 4
  end_time: auto
  animation_frames: 40
  time_history_points: 500
  stop_on_energy_error: false  # element deletion removes IE from the balance at burst
  stop_on_negative_volume: true

output:
  dir: runs/lc6_pris_vent_burst_v3
  render: true
  report: true

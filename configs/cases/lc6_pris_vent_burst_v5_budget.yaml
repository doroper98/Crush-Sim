# LC-6 v5 BUDGET vent mesh - score at 0.7 mm, looking for the 30-minute preset.
#
# GOAL.md (2026-09-07): one run <= 30 min on a 4-core laptop, <= 10 % from the
# precise result. Measured engine times so far (pipeline_summary.json):
#   1.2 mm uniform  11 min   but 0.514/0.703 MPa  (+79 %/+92 % vs fine: outside)
#   0.5 mm          39 min   0.303/0.385 MPa      (-5 % vs fine: inside, but over budget)
#   0.3 mm          7.3 h    0.287/0.366 MPa      (reference)
# So no existing preset meets BOTH numbers. This case probes 0.7 mm: cycles
# scale roughly with 1/min_edge, so ~25 min is expected; the question is
# whether initiation/opening stay within 10 % of the 0.3 mm reference
# (0.287 / 0.366 MPa -> must land in 0.258-0.316 / 0.329-0.403).
# TRIED 0.7 mm first: refused by the mesh gate - min edge 0.218 mm < limit
# vent_size/3 = 0.233 mm. The finest edges come from the score-arc imprint and
# sit near 0.21 mm whatever vent_size is (0.5 mm case: 0.208 mm), so the
# vent_size/3 cost guard, meant for deliberate refinement, bites when the
# vent_size is COARSENED. 0.65 mm keeps the limit (0.217) under the imprint
# edge; the gate logic itself is left alone until analysis_005 decides.
# MEASURED: (fill in from runs/lc6_pris_vent_burst_v5_budget/pipeline_summary.json)

name: lc6_pris_vent_burst_v5_budget
load_case: LC-3
description: >-
  Prismatic cell can (120.5 x 13.1 x 65, t0.6, braced) with a production
  foil vent: 30 x 7 mm Al 1050-O membrane (0.1 mm) welded into the cap,
  petal_x score pattern at 0.03 mm - internal pressure ramp to petal burst.

geometry:
  kind: box_can
  width: 120.5
  depth: 13.1
  height: 65.0
  thickness: 0.6
  closed_bottom: true
  closed_top: true
  vent:
    length: 30.0
    width: 7.0
    band: 1.0                 # score line width (petal_x arms catch band/2)
    membrane_thickness: 0.1   # welded-in foil
    score_thickness: 0.03     # coined groove residual
    pattern: petal_x
    material: al1050_foil
    eps_p_max: 0.40           # soft Al elongation; can body keeps 0.35

material:
  key: ni_plated_steel_can
  eps_p_max: 0.35

mesh:
  target_size: 1.2
  vent_size: 0.65         # BUDGET probe: coarsest score mesh that may still sit within 10 % of fine
  recombine: true
  curvature_points: 12

loading:
  tool: none                # pressure-driven
  clamp_can_base: true
  brace_walls: true         # jelly roll + module end plates on the large faces

pressure:
  peak: 0.85                # MPa - just past burst; short hold to catch the petal opening
  rise: 3.0e-3
  hold: 0.5e-3

contact:
  friction: 0.15

solver:
  config: configs/solver.yaml
  threads: 4
  end_time: auto
  animation_frames: 40
  time_history_points: 500
  stop_on_energy_error: false  # element deletion removes IE from the balance at burst
  stop_on_negative_volume: true

output:
  dir: runs/lc6_pris_vent_burst_v5_budget
  render: true
  report: true

# B-1 - axial crush mean load benchmark (spec §8).
#
# LC-1 axial crush of the reference can shell by a flat platen; the measured
# mean crush load is compared against the Alexander approximation
#     P_m = sigma_0 * t^2 * (6 * sqrt(D/t) + 3.44),  sigma_0 = (sigma_y+UTS)/2
# bench/test_benchmarks.py::test_b1_mean_crush_load_matches_alexander reads
# runs/bench_b1/force_displacement.csv (CRUSHSIM_BENCH_B1 overrides).

name: bench_b1
load_case: LC-1
description: >-
  B-1 benchmark: axial crush of the reference can shell (R33 x H115 x t0.1)
  by a rigid platen, displacement controlled.

geometry:
  kind: parametric_can
  radius: 33.0
  height: 115.0
  thickness: 0.1
  closed_bottom: false
  closed_top: false

material:
  key: aluminum_3003

mesh:
  target_size: 1.2
  recombine: true
  imperfection_mm: 0.1    # 1x wall thickness: regularises the buckling peak (B-3)
  curvature_points: 12

loading:
  tool: platen
  direction: [0.0, 0.0, -1.0]
  stroke: 30.0                  # mm - enough for several concertina folds
  velocity: 2.0                 # m/s - the ~230 N fold load dwarfs inertia
  ramp_fraction: 0.1
  tool_gap: 0.5

contact:
  friction: 0.15
  gap_scale: 0.8
  stiffness_scale: 1.0

solver:
  config: configs/solver.yaml
  threads: 8
  end_time: auto
  animation_frames: 15
  time_history_points: 500
  stop_on_energy_error: true
  stop_on_negative_volume: true

output:
  dir: runs/bench_b1
  render: false
  report: true

# LC-6 v5 MEDIUM vent mesh - score resolved at 0.5 mm.
#
# Mesh convergence on the vent, not the can: element-deletion fracture is
# mesh-sensitive, so the score's own resolution is the variable that moves
# the burst pressure. mesh.vent_size refines the flap alone (the can wall,
# the weld band and the narrow cap remainder keep their gated sizes - that
# remainder is at its best coarse). Score resolution 4.5 elements per mm of
# arc vs 0.6 in the baseline v5, for +1000 elements.
#
# MEASURED: initiation 0.303 MPa, opening 0.385 MPa. Refining a further
# 40% (_fine, 0.3 mm) moves these only 5% for 17x the run time, so THIS
# is the working mesh for vent burst. Energy error 9.1% - element
# deletion removes internal energy from the balance; see
# docs/VENT_BURST.md before quoting a burst pressure.

name: lc6_pris_vent_burst_v5_medium
load_case: LC-3
description: >-
  Prismatic cell can (120.5 x 13.1 x 65, t0.6, braced) with a production
  foil vent: 30 x 7 mm Al 1050-O membrane (0.1 mm) welded into the cap,
  petal_x score pattern at 0.03 mm - internal pressure ramp to petal burst.

geometry:
  kind: box_can
  width: 120.5
  depth: 13.1
  height: 65.0
  thickness: 0.6
  closed_bottom: true
  closed_top: true
  vent:
    length: 30.0
    width: 7.0
    band: 1.0                 # score line width (petal_x arms catch band/2)
    membrane_thickness: 0.1   # welded-in foil
    score_thickness: 0.03     # coined groove residual
    pattern: petal_x
    material: al1050_foil
    eps_p_max: 0.40           # soft Al elongation; can body keeps 0.35

material:
  key: ni_plated_steel_can
  eps_p_max: 0.35

mesh:
  target_size: 1.2
  vent_size: 0.5          # local refinement of the vent flap (score resolution)
  recombine: true
  curvature_points: 12

loading:
  tool: none                # pressure-driven
  clamp_can_base: true
  brace_walls: true         # jelly roll + module end plates on the large faces

pressure:
  peak: 0.85                # MPa - just past burst; short hold to catch the petal opening
  rise: 3.0e-3
  hold: 0.5e-3

contact:
  friction: 0.15

solver:
  config: configs/solver.yaml
  threads: 4
  end_time: auto
  animation_frames: 40
  time_history_points: 500
  stop_on_energy_error: false  # element deletion removes IE from the balance at burst
  stop_on_negative_volume: true

output:
  dir: runs/lc6_pris_vent_burst_v5_medium
  render: true
  report: true

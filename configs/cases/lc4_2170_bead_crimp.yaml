# LC-4 - 2170 battery can: rotary beading then crimping (two-stage forming).
#
# Stage 0 (rotary beading): a torus-rim roller ORBITS the can axis while
# feeding radially inward - the real process kinematics - leaving a
# continuous circumferential groove around the neck (cf. the bead visible on
# production 2170 cells). The feed completes over the first revolution and
# the remaining quarter-turn irons the groove at constant depth.
# Stage 1 (crimping, simplified): an axial platen presses the open rim down
# so the neck folds at the groove. The real crimp with cap and gasket needs
# those parts modelled; this run captures the can-side deformation only.

name: lc4_2170_bead_crimp
load_case: LC-3
description: >-
  2170 battery can (R10.5 x H70 x t0.3, closed bottom, Ni-plated can steel):
  stage-0 rotary beading (orbiting torus roller, 1.25 revolutions) near the
  rim, stage-1 axial press folding the neck at the groove.

geometry:
  kind: parametric_can
  radius: 10.5
  height: 70.0
  thickness: 0.3
  closed_bottom: true
  closed_top: false

material:
  key: ni_plated_steel_can  # literature card (Hilumin-class); trend-grade

mesh:
  target_size: 0.6      # 0.5 recombines a sliver on the bottom cap (SICN 0.03)
  recombine: true
  curvature_points: 12

loading:
  # Main tool = the stage-1 crimp press (its contact force is the curve).
  tool: platen
  direction: [0.0, 0.0, -1.0]
  stroke: 3.5               # 0.5 gap + 3.0 mm of rim fold-down
  velocity: 1.5
  ramp_fraction: 0.1
  tool_gap: 0.5
  tool_size: 30.0
  stage: 1
  clamp_can_base: true      # the chuck grips the base during both stages
  extra_tools:
    # Stage-0 rotary beading roller: torus rim (outer dia 11 mm, rim r 1.5),
    # orbiting at 10 m/s tangential, feeding 2.0 mm (0.5 gap + 1.5 groove)
    # over the first revolution.
    # TWO rollers 180 degrees apart, orbiting together - like the production
    # machines - cancelling the net radial force (a single roller ovalised
    # the free rim, 2.1 mm groove spread). The feed is spread over TWO
    # revolutions (1 mm/rev, spin-forming style): completing it in under a
    # revolution froze a plastic ovalisation into the section that a
    # constant-depth ironing pass could not erase (still 2.0 mm spread).
    # A final full revolution irons at constant depth.
    - {tool: bead_roller, motion: orbit, direction: [1.0, 0.0, 0.0],
       stroke: 2.0, velocity: 10.0, orbit_revs: 3.0, feed_revs: 2.0,
       tool_gap: 0.5, indenter_radius: 1.5, tool_size: 11.0,
       height_frac: 0.914, stage: 0}
    - {tool: bead_roller, motion: orbit, direction: [-1.0, 0.0, 0.0],
       stroke: 2.0, velocity: 10.0, orbit_revs: 3.0, feed_revs: 2.0,
       tool_gap: 0.5, indenter_radius: 1.5, tool_size: 11.0,
       height_frac: 0.914, stage: 0}

contact:
  friction: 0.15
  gap_scale: 0.8
  stiffness_scale: 1.0

solver:
  config: configs/solver.yaml
  threads: 4
  end_time: auto
  animation_frames: 40
  time_history_points: 500
  stop_on_energy_error: true
  stop_on_negative_volume: true

output:
  dir: runs/lc4_2170_bead_crimp
  render: true
  report: true

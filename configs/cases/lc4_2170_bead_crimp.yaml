# LC-4 - 2170 battery can: beading then crimping (two-stage forming demo).
#
# Stage 0 (beading): four small cylinder rollers press radially inward near
# the top of the can, forming the circumferential bead groove segments. The
# full rotary process is axisymmetric, so simultaneous radial rollers
# approximate the finished groove without modelling the spinning pass.
# Stage 1 (crimping, simplified): an axial platen presses the open rim down
# so the neck folds at the groove - the "press over the bead" step. The real
# crimp with cap and gasket needs those parts modelled; this run captures
# the can-side deformation only.

name: lc4_2170_bead_crimp
load_case: LC-3
description: >-
  2170 battery can (R10.5 x H70 x t0.3, closed bottom, steel): stage-0
  four-roller beading near the rim, stage-1 axial press folding the neck at
  the groove.

geometry:
  kind: parametric_can
  radius: 10.5
  height: 70.0
  thickness: 0.3
  closed_bottom: true
  closed_top: false

material:
  key: steel_a36            # trend-only proxy for nickel-plated can steel

mesh:
  target_size: 0.6      # 0.5 recombines a sliver on the bottom cap (SICN 0.03)
  recombine: true
  curvature_points: 12

loading:
  # Main tool = the stage-1 crimp press (its contact force is the curve).
  tool: platen
  direction: [0.0, 0.0, -1.0]
  stroke: 3.5               # 0.5 gap + 3.0 mm of rim fold-down
  velocity: 1.5
  ramp_fraction: 0.1
  tool_gap: 0.5
  tool_size: 30.0
  stage: 1
  clamp_can_base: true      # the chuck grips the base during both stages
  extra_tools:              # stage-0 bead rollers, 90 degrees apart
    - {tool: cylinder, direction: [ 1.0,  0.0, 0.0], stroke: 2.0, velocity: 1.5,
       tool_gap: 0.5, indenter_radius: 1.5, tool_size: 12.0, height_frac: 0.914, stage: 0}
    - {tool: cylinder, direction: [-1.0,  0.0, 0.0], stroke: 2.0, velocity: 1.5,
       tool_gap: 0.5, indenter_radius: 1.5, tool_size: 12.0, height_frac: 0.914, stage: 0}
    - {tool: cylinder, direction: [ 0.0,  1.0, 0.0], stroke: 2.0, velocity: 1.5,
       tool_gap: 0.5, indenter_radius: 1.5, tool_size: 12.0, height_frac: 0.914, stage: 0}
    - {tool: cylinder, direction: [ 0.0, -1.0, 0.0], stroke: 2.0, velocity: 1.5,
       tool_gap: 0.5, indenter_radius: 1.5, tool_size: 12.0, height_frac: 0.914, stage: 0}

contact:
  friction: 0.15
  gap_scale: 0.8
  stiffness_scale: 1.0

solver:
  config: configs/solver.yaml
  threads: 4
  end_time: auto
  animation_frames: 30
  time_history_points: 500
  stop_on_energy_error: true
  stop_on_negative_volume: true

output:
  dir: runs/lc4_2170_bead_crimp
  render: true
  report: true

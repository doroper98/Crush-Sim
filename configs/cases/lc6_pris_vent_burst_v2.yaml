# LC-6 v2 - prismatic vent burst with module bracing (issue #24, stage 1b).
#
# v1 (lc6_pris_vent_burst) exposed a modelling gap: the empty, unsupported
# can ballooned its wide flat faces and tore them near the cap rim at
# 1.2 MPa - before the scored cap vent opened (score band ruptured only
# from 2.4 MPa, into an already-failing can). In the real cell the jelly
# roll fills the can and the module end plates press on the large faces,
# so they barely bow. v2 models that support with loading.brace_walls:
# the two large-face node sets lose their face-normal (Y) translation,
# leaving the cap, narrow walls, and the vent flap free. Expected: the
# score band is now the genuine weak point and sets the burst pressure.

name: lc6_pris_vent_burst_v2
load_case: LC-3
description: >-
  Prismatic cell can (120.5 x 13.1 x 65, t0.6, Ni-plated steel, welded cap)
  with a 14 x 7 mm stadium vent scored to 0.06 mm, large faces braced as in
  a module: internal pressure ramp to burst through the score band.

geometry:
  kind: box_can
  width: 120.5
  depth: 13.1
  height: 65.0
  thickness: 0.6
  closed_bottom: true
  closed_top: true
  vent:
    length: 14.0
    width: 7.0
    band: 1.0
    score_thickness: 0.06

material:
  key: ni_plated_steel_can
  eps_p_max: 0.35           # score band tears here -> element deletion

mesh:
  target_size: 1.2
  recombine: true
  curvature_points: 12

loading:
  tool: none                # pressure-driven
  clamp_can_base: true
  brace_walls: true         # jelly roll + module end plates on the large faces

pressure:
  peak: 3.0                 # MPa - typical prismatic vent range is 1-3 MPa
  rise: 3.0e-3
  hold: 1.0e-3

contact:
  friction: 0.15

solver:
  config: configs/solver.yaml
  threads: 4
  end_time: auto
  animation_frames: 40
  time_history_points: 500
  stop_on_energy_error: false  # element deletion removes IE from the balance at burst
  stop_on_negative_volume: true

output:
  dir: runs/lc6_pris_vent_burst_v2
  render: true
  report: true

# LC-2 - lateral jig crush. Spec §5.3. This is the project's original purpose.
#
# The can rests on the fixed FLOOR at Z = 0 and a rigid flat jig plate is driven
# radially (+X -> -X) into the side wall under displacement control.
# Primary outputs: crush force vs. dent curve, residual dent depth.

name: lc2_default
load_case: LC-2
description: >-
  Lateral crush of a parametric beverage-can shell (R33 x H115 x t0.1) by a flat
  rigid jig plate driven radially. Displacement controlled, quasi-static.

geometry:
  kind: parametric_can
  radius: 33.0
  height: 115.0
  thickness: 0.1
  closed_bottom: false
  closed_top: false

material:
  key: aluminum_3003

mesh:
  target_size: 1.2
  recombine: true
  curvature_points: 12

loading:
  tool: jig_plane
  direction: [1.0, 0.0, 0.0]    # radial, +X towards the can axis
  stroke: 20.0                  # mm; ~30% of the diameter
  velocity: 2.0                 # m/s
  ramp_fraction: 0.1
  tool_gap: 0.5
  tool_size: 120.0              # mm plate edge length

contact:
  friction: 0.15
  gap_scale: 0.8
  stiffness_scale: 1.0

solver:
  config: configs/solver.yaml
  threads: 8
  end_time: auto
  animation_frames: 25
  time_history_points: 500
  stop_on_energy_error: true
  stop_on_negative_volume: true

output:
  dir: runs/lc2_default
  render: true
  report: true

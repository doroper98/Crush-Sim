name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Rendering is always offscreen; no display is available on any runner.
  PYVISTA_OFF_SCREEN: "true"
  MPLBACKEND: "Agg"

jobs:
  test:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The Gmsh wheel links against libGLU/libXft even in headless use, and
      # PyVista needs a software OpenGL implementation (OSMesa) to render
      # offscreen. Both are absent from the bare Ubuntu runner image.
      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglu1-mesa libxft2 libxinerama1 libxcursor1 \
            libfontconfig1 libxrender1 libosmesa6 xvfb

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Phase-0 Day-1 environment gate. Informational in CI: the solver
      # binaries are intentionally absent, and doctor reports that as a warning.
      - name: Environment check (csim doctor)
        continue-on-error: true
        run: csim doctor

      - name: Run tests
        run: pytest -m "not bench" -q

      - name: Upload test artefacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crushsim-failure-${{ matrix.os }}
          path: |
            runs/
            tests/golden/
          if-no-files-found: ignore
          retention-days: 7

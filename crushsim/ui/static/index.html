<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crush-Sim 작업실</title>
<!-- 로컬 자산만: 외부 CDN·폰트·분석 서비스 없음 (UI_001 §15) -->
<link rel="stylesheet" href="/static/fonts.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<!-- 작은 화면에서는 결과 열람이 우선이고 제출은 데스크톱에서 이어간다 (§3.2) -->
<section id="mobileNotice">
  <h1>Crush-Sim</h1>
  <p>해석 설정은 PC에서 이어서 할 수 있습니다.</p>
  <p class="muted small">이 화면에서는 완료된 해석의 결과·뷰어·리포트를 열어볼 수 있습니다.</p>
  <div id="mobileRuns" class="empty">불러오는 중…</div>
</section>

<div class="app" id="app">

  <header class="topbar">
    <h1>Crush-Sim</h1>
    <span class="project-name" id="projectName">새 해석</span>
    <span class="save-state" id="saveState" role="status" aria-live="polite"></span>
    <span class="spacer"></span>
    <button class="btn small" id="paneTabs" aria-pressed="false">그래프 보기</button>
    <button class="btn small" id="inspectorToggle" aria-expanded="false" aria-controls="inspector">설정 패널</button>
    <button class="btn small" id="btnOpen">열기</button>
    <button class="btn small" id="btnSave">저장</button>
    <button class="btn small" id="btnNew">새 해석</button>
    <button class="btn small" id="btnHelp" aria-haspopup="dialog">도움말</button>
  </header>

  <div class="workspace">

    <nav class="left" aria-label="해석 단계">
      <h2 class="side-title">안내 단계</h2>
      <ol class="steps" id="stepList"></ol>
      <div class="side-block">
        <h2 class="side-title">부품</h2>
        <ul class="part-list" id="partList"><li class="empty small">형상을 먼저 정하세요</li></ul>
      </div>
      <div class="side-block">
        <h2 class="side-title">실행</h2>
        <button class="btn small" id="btnRunsFromSide" aria-controls="runPanel">실행 목록 열기</button>
      </div>
    </nav>

    <div class="center" id="center">
      <section class="pane preview" id="panePreview" data-tab="on" aria-label="형상 미리보기">
        <div class="pane-head">
          <span id="previewLabel">형상 미리보기</span>
          <button class="btn small" id="btnFitView">전체 보기</button>
          <button class="btn small" id="btnSelectedView">선택 부품 보기</button>
        </div>
        <canvas id="preview3d" aria-label="형상 3D 미리보기"></canvas>
        <div class="preview-note" id="previewNote" hidden></div>

        <!-- 처음 열었을 때: 빈 캔버스 대신 시작 영역 (§3.3) -->
        <div class="start-overlay" id="startArea">
          <div class="start-card">
            <h2>어떤 셀을 검토할까요?</h2>
            <p class="muted">셀 형상을 넣고, 설계 방향을 빠르게 확인하세요.</p>
            <p class="muted small">압착·강도·벤트 개방을 초기 설계 단계에서 검토합니다. 목표: 4코어 노트북에서 1건 30분 이내.</p>
            <div class="start-grid">
              <button class="btn start-choice main" id="startParametric">
                <b>치수로 빠르게 시작</b><span>원통형·각형 캔을 치수로 만듭니다.</span>
              </button>
              <button class="btn start-choice" id="startStep">
                <b>STEP 파일 가져오기</b><span>.stp 또는 .step 파일을 선택하세요.</span>
              </button>
              <button class="btn start-choice" id="startOpenGraph">
                <b>저장한 그래프 열기</b><span>이전에 저장한 해석 구성을 이어서 봅니다.</span>
              </button>
              <button class="btn start-choice" id="startExample">
                <b>예제로 둘러보기</b><span>예제 형상·예제 조건으로 화면을 둘러봅니다.</span>
              </button>
            </div>
          </div>
        </div>
      </section>

      <div class="splitter" id="splitter" role="separator" aria-orientation="horizontal"
           aria-label="형상과 그래프의 비율" tabindex="0"></div>

      <section class="pane graph" id="paneGraph" data-tab="on" aria-label="연결 그래프">
        <div class="pane-head">
          <div class="graph-toolbar">
            <button class="btn small" id="btnUndo" title="실행 취소 (Ctrl+Z)">되돌리기</button>
            <button class="btn small" id="btnRedo" title="다시 실행 (Ctrl+Shift+Z)">다시</button>
            <button class="btn small" id="btnAddNode" aria-haspopup="dialog">노드 추가</button>
            <button class="btn small" id="btnToggleSettings" aria-pressed="true">해석 설정 그룹</button>
          </div>
          <span class="graph-msg" id="graphMsg" role="status" aria-live="polite"></span>
        </div>
        <div class="graph-wrap" id="graphWrap">
          <div class="graph-canvas" id="graphCanvas"><svg id="graphWires" aria-hidden="true"></svg></div>
        </div>
      </section>
    </div>

    <aside class="right" id="inspector" aria-label="설정 패널"></aside>
  </div>

  <div class="runbar">
    <div>
      <div class="estimate" id="runEstimate">조건을 확인하는 중…</div>
      <div class="small muted" id="runBasis"></div>
    </div>
    <div id="runNotices"></div>
    <span class="spacer"></span>
    <button class="btn" id="btnRunPanel" aria-expanded="false" aria-controls="runPanel">실행 목록</button>
    <button class="btn primary" id="btnStart" disabled>해석 시작</button>
  </div>

  <section class="runpanel" id="runPanel" hidden aria-label="실행 목록"></section>
</div>

<input type="file" id="stepFile" accept=".stp,.step" class="visually-hidden" aria-hidden="true" tabindex="-1">
<dialog class="modal" id="modal"></dialog>
<div id="liveRegion" class="visually-hidden" role="status" aria-live="polite"></div>

<script src="/static/render3d.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
